name: Update JSON Extractor

on:
  workflow_dispatch:
  # دەتوانیت کاتیشی بۆ دابنێیت بۆ ئەوەی خۆکارانە ڕۆژانە نوێ ببێتەوە
  # schedule:
  #   - cron: '0 0 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install requests
        run: pip install requests

      - name: Run script
        run: python extractor.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: json-file
          path: ashtemobile94.json
