name: Auto Fetch and Upload IPAs

on:
  workflow_dispatch: # بۆ ئەوەی بتوانیت بە دەستی لە بەشی Actions ئیشی پێ بکەیت
  schedule:
    - cron: '0 0 * * *' # هەموو شەوێک کاتژمێر ١٢ خۆی ئۆتۆماتیکی ئیش دەکات بۆ ئەپدەیت

permissions:
  contents: write # گرنگە بۆ ئەوەی بتوانێت فایلەکان بخاتە Releases و JSON بنێرێت

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Auto Scraper and Uploader
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scraper.py

      - name: Commit and Push JSON file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ashtemobile94.json
          git commit -m "Auto-update apps JSON with GitHub Releases links" || exit 0
          git push
